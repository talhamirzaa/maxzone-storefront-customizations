<style>
    .main-offer-div {
        border-radius: 0.8rem;
        border-left: 2px solid black;
        padding: 0.7rem 1rem;
        box-shadow: 0px 3px 10px #0000004a;
    }

    .offer-div-heading {
        font-size: 1.5rem;
        font-weight: bold;
        margin: 1rem 0;
    }

    .offer-title {
        font-size: 1.3rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        /* space between icon and text */
        margin: 0.1rem 0;
    }

    .offer-note-title {
        font-size: 1.2rem;
    }

    .offer {
        padding: 0.1rem;
    }

    .offer-note {
        padding-top: 0;
        padding-left: 1rem;
    }

    .offers li.offer-note:not(:has(~ li.offer-note)) {
        padding-bottom: 0.7rem;
    }

    .offer span,
    .offer-note span {
        padding-top: 3px;
    }

    .offers {
        margin: 0;
        padding-left: 0;
        /* removes default list indent */
        list-style: none;
        /* removes bullets */
    }

    .offers::marker {
        line-height: 1;
    }
</style>
